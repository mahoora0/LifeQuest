spring:
  application:
    name: lifequest-api
  config:
    # backend/ 실행은 ../.env, 저장소 루트·IDE 실행은 ./.env를 사용한다.
    # OS 환경 변수와 명령행 인자가 .env보다 우선한다.
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lifequest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:lifequest}
    password: ${DB_PASSWORD:lifequest-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      # 인증 게시물은 사진을 최대 5장 함께 올린다(app.proof.max-photos).
      # 요청 한도를 장당 한도에 맞춰 두면 5MB 사진 두 장에서 이미 막힌다.
      max-request-size: 26MB

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:change-this-local-jwt-secret-at-least-32-bytes}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
    max-profile-image-bytes: 5242880
    max-proof-image-bytes: 5242880
  proof:
    # 사용자가 적은 개발·시연 환경에서는 min-votes를 1로 낮춰야 판정까지 확인할 수 있다.
    min-votes: ${PROOF_MIN_VOTES:3}
    agree-threshold: 0.70
    unclear-floor: 0.40
    max-photos: 5
    vote-exp: 1
    daily-vote-exp-grants: 5
  llm:
    provider: ${LLM_PROVIDER:}
    request-timeout-seconds: ${LLM_REQUEST_TIMEOUT_SECONDS:30}
    daily-request-limit: ${LLM_DAILY_REQUEST_LIMIT:10}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:}
