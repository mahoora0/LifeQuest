spring:
  datasource:
    url: jdbc:h2:mem:lifequest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

app:
  jwt:
    secret: test-jwt-secret-that-is-at-least-32-bytes
    access-token-seconds: 900
    refresh-token-seconds: 1209600
  google:
    client-id: ""
  upload:
    directory: build/test-uploads
  llm:
    provider: ""
    request-timeout-seconds: 1
    daily-request-limit: 10
    openai:
      api-key: ""
      model: ""
    gemini:
      api-key: ""
      model: ""
