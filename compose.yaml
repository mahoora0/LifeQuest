services:
  mysql:
    image: mysql:8.4
    container_name: lifequest-mysql
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lifequest}
      MYSQL_USER: ${MYSQL_USER:-${DB_USERNAME:-lifequest}}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-lifequest-local}}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lifequest-root-local}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - lifequest-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  lifequest-mysql-data:
